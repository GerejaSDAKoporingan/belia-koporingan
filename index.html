<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belia SDA Koporingan | Home</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          apple: { text: '#1d1d1f', gray: '#86868b', blue: '#0066cc', light: '#f5f5f7' }
        }
      }
    }
  }
</script>

<style>
  body { background-color: #ffffff; color: #1d1d1f; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

  /* Glassmorphism Nav */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }

  /* Hide scrollbar for mobile menu */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .hero-container { padding-top: 110px; } /* Added more space for double-row mobile nav */
  @media (min-width: 768px) { .hero-container { padding-top: 80px; } }

  .hero-image {
    background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('Index-wallpaper.png');
    background-size: cover; background-position: center; border-radius: 40px; height: 70vh;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }

  .bento-card { background: #ffffff; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: all 0.4s ease; }
  .bento-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

  .reveal { opacity: 0; transform: translateY(20px); transition: all 0.8s ease-out; }
  .reveal.show { opacity: 1; transform: translateY(0); }
</style>
</head>

<body>

<nav>
  <div class="max-w-7xl mx-auto px-6">
    <div class="h-16 flex items-center justify-between">
      <div class="text-lg font-bold tracking-tight">Belia SDA Koporingan</div>
      <a href="#" class="bg-apple-blue text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-blue-700 transition-all shadow-md">
        Join Us
      </a>
    </div>

    <div class="md:hidden flex space-x-6 overflow-x-auto no-scrollbar pb-3 text-sm font-semibold text-apple-gray">
      <a href="index.html" class="text-apple-text whitespace-nowrap">Home</a>
      <a href="timeline.html" class="whitespace-nowrap">Timeline Aktiviti</a>
      <a href="contact.html" class="whitespace-nowrap">Contact Us</a>
    </div>

    <div class="hidden md:flex absolute top-0 left-1/2 -translate-x-1/2 h-16 items-center space-x-8 text-sm font-medium text-apple-gray">
      <a href="index.html" class="text-apple-text hover:text-apple-blue transition-colors">Home</a>
      <a href="timeline.html" class="hover:text-apple-blue transition-colors">Timeline Aktiviti</a>
      <a href="contact.html" class="hover:text-apple-blue transition-colors">Contact Us</a>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 md:px-6">

  <section class="hero-container reveal">
    <div class="hero-image">
      <div class="px-4">
        <h1 class="text-4xl md:text-6xl font-bold text-white tracking-tight mb-4">
          Bertumbuh dalam Hikmat dan Kasih
        </h1>
        <p class="text-white/90 text-lg md:text-xl font-light">Gereja SDA Koporingan – Jabatan Belia</p>
        <div class="mt-8 flex justify-center">
            <a href="timeline.html" class="bg-white text-black px-10 py-4 rounded-full font-semibold hover:bg-gray-100 transition-all shadow-lg">
              Explore Timeline
            </a>
        </div>
      </div>
    </div>
  </section>

  <section class="py-24">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto reveal">
      <div class="bento-card p-10 text-center">
        <img src="MG.png" class="h-16 mx-auto mb-4 object-contain">
        <h3 class="text-apple-gray text-xs font-semibold uppercase tracking-widest">Master Guide</h3>
        <p class="text-3xl font-bold mt-2">3 <span class="text-lg font-medium">Ahli</span></p>
      </div>
      <div class="bento-card p-10 text-center">
        <img src="Pathfinder.png" class="h-16 mx-auto mb-4 object-contain">
        <h3 class="text-apple-gray text-xs font-semibold uppercase tracking-widest">Pathfinder</h3>
        <p class="text-3xl font-bold mt-2">10 <span class="text-lg font-medium">Ahli</span></p>
      </div>
      <div class="bento-card p-10 text-center">
        <img src="Adventurer.webp" class="h-16 mx-auto mb-4 object-contain">
        <h3 class="text-apple-gray text-xs font-semibold uppercase tracking-widest">Adventurer</h3>
        <p class="text-3xl font-bold mt-2">7 <span class="text-lg font-medium">Ahli</span></p>
      </div>
    </div>
  </section>

</main>

<footer class="bg-apple-light py-16 text-center">
    <p class="text-apple-gray text-sm">© 2026 Jabatan Belia Gereja SDA Koporingan</p>
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
